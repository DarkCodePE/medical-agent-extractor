openapi: 3.0.3
info:
  title: Medical Agent Extractor API - Registro de Medicamentos Enriquecidos
  description: |
    ## 🏥 API para Registro de Medicamentos Enriquecidos con IA
    
    Esta API permite registrar medicamentos enriquecidos en la base de datos GTIN después de ser procesados por algoritmos de IA.
    
    ### 🔍 **Características Principales:**
    - ✅ Registro directo de medicamentos enriquecidos por IA
    - ✅ Validación automática de códigos GTIN
    - ✅ Marcado automático con flag `IsAiGenerated = true`
    - ✅ Vectorización automática en Qdrant
    - ✅ Trazabilidad completa del proceso de enriquecimiento
    
    ### 🔄 **Flujo de Integración:**
    ```
    /extract → datos enriquecidos → /register-enriched → BD + Vectorización
    ```
    
    ### 🛡️ **Seguridad:**
    - Requiere aprobación explícita del usuario
    - Validación de unicidad de GTIN
    - Metadatos completos de auditoría
    
  version: 1.0.0
  contact:
    name: Medical Agent Extractor Team
    email: dev@medical-agent.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:9088
    description: Servidor de desarrollo local
  - url: https://api.medical-agent.com
    description: Servidor de producción

paths:
  /api/medication/register-enriched:
    post:
      tags:
        - medication
      summary: Registrar medicamento enriquecido en base de datos GTIN
      description: |
        ## 📝 Registro de Medicamento Enriquecido con IA

        Este endpoint registra directamente un medicamento enriquecido en la base de datos GTIN, 
        preparando automáticamente los datos y marcándolo como generado por IA.

        ### 🔍 **Flujo Completo:**
        1. **Recibe datos**: `MedicationData` (del endpoint `/extract`) + metadatos de enriquecimiento
        2. **Validación automática**: Verifica GTIN único, campos obligatorios y aprobación del usuario
        3. **Preparación inteligente**: Determina tipo GTIN automáticamente y mapea campos
        4. **Registro en BD**: Inserta con flag `IsAiGenerated = true` para auditoría
        5. **Vectorización automática**: Actualiza Qdrant para mejorar futuras búsquedas semánticas

        ### 📊 **Validaciones y Procesamiento Automático:**
        - ✅ Determina tipo de GTIN por longitud del código (GTIN_8/12/13/14)
        - ✅ Verifica que el GTIN no exista previamente en la base de datos
        - ✅ Valida campos obligatorios: `medication_name`, `common_denomination`, `gtin_code`
        - ✅ Requiere aprobación explícita del usuario (`user_approved: true`)
        - ✅ Marca automáticamente como generado por IA para auditoría

        ### 🎯 **Campos Automáticos/Opcionales:**
        - **Automáticos**: `gtin_code_type`, `IsAiGenerated = true`
        - **Con defaults**: `pharmacy_type = "M"`, `state = "ACTIVO"`, `fractions = "1"`
        - **Opcionales**: `code_rs_list`, campos vacíos se almacenan como cadena vacía

        ### 🛡️ **Seguridad y Trazabilidad Completa:**
        - 🔐 Solo acepta medicamentos con `user_approved = true`
        - 📊 Mantiene metadatos completos de enriquecimiento y confianza
        - 🏷️ Flag `IsAiGenerated` diferencia registros automáticos vs manuales
        - 📈 Actualización automática de vectores semánticos para mejorar el sistema
        - ⚡ Respuesta incluye confirmación de vectorización y metadatos de auditoría

        ### 📋 **Estructura de Entrada:**
        ```json
        {
          "medication_data": { /* Datos del medicamento del endpoint /extract */ },
          "gtin_code": "código GTIN extraído o validado",
          "enrichment_source": "semantic_search | ocr_extraction | database_gtin",
          "enrichment_confidence": 0.87,
          "user_approved": true
        }
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicationRegistrationRequest'
            example:
              medication_data:
                medication_name: "Bronpax"
                common_denomination: "Ambroxol"
                concentration: "7.5 mg/mL"
                form: "Solución oral"
                form_simple: "Gotas"
                brand_name: "FARMINDUSTRIA"
                country: "PERÚ"
                presentation: "20mL"
                product_type: "PRODUCTO FARMACEUTICO"
                fractions: "1"
                gtin_code: null
                lot_number: "LT240815"
                expiration_date: "2025-12-01"
                database_id: 11535
              gtin_code: "7750304964586"
              enrichment_source: "semantic_search"
              enrichment_confidence: 0.87
              user_approved: true
              pharmacy_type: "M"
              state: "ACTIVO"
      responses:
        '200':
          description: Medicamento registrado exitosamente en la base de datos GTIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicationRegistrationResponse'
              example:
                status: "success"
                message: "Medicamento 'Bronpax' registrado exitosamente como generado por IA"
                medication_id: 12345
                gtin_code: "7750304964586"
                registered_at: "2024-01-15T10:30:00Z"
                is_ai_generated: true
                enrichment_metadata:
                  enrichment_source: "semantic_search"
                  enrichment_confidence: 0.87
                  user_approved: true
                  auto_vectorized: true
        '400':
          description: Datos de entrada inválidos o medicamento ya existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/medication/register-sku:
    post:
      tags:
        - medication
      summary: Registrar SKU de medicamento en base de datos
      description: |
        ## 📦 Registro de SKU de Medicamento

        Este endpoint registra un SKU (Stock Keeping Unit) específico de un medicamento en la tabla `ItemGtinSkus`.

        ### 🔍 **Información del SKU:**
        - **Lote específico**: Número de lote del medicamento
        - **Fecha de expiración**: Cuándo vence el lote
        - **Cantidad disponible**: Stock actual
        - **Precio unitario**: Costo por unidad
        - **Farmacia**: Dónde se almacena el SKU

        ### 📊 **Validaciones:**
        - ✅ Verifica que el `item_gtin_id` existe en `ItemsGtin`
        - ✅ Verifica que no exista un SKU con el mismo lote para el mismo GTIN
        - ✅ Valida formato de fechas (yyyy-MM-dd)
        - ✅ Requiere campos obligatorios: lote, expiración, cantidad, farmacia

        ### 🎯 **Casos de Uso:**
        - **Nuevo lote**: Registrar stock recién recibido
        - **Actualización**: Agregar más unidades a un lote existente
        - **Control de inventario**: Seguimiento de fechas de vencimiento

        ### 📋 **Estructura de Entrada:**
        ```json
        {
          "item_gtin_id": 11535,
          "gtin_code": "7750304964586",
          "lot_number": "LT240815",
          "expiration_date": "2025-12-01",
          "quantity": 100,
          "price": 15.50,
          "pharmacy_id": 1,
          "uploader_id": 1
        }
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkuRegistrationRequest'
            example:
              item_gtin_id: 11535
              gtin_code: "7750304964586"
              lot_number: "LT240815"
              expiration_date: "2025-12-01"
              quantity: 100
              price: 15.50
              pharmacy_id: 1
              uploader_id: 1
              received_date: "2024-01-15"
              code: "SKU001"
              description: "Lote de prueba"
              is_active: true
      responses:
        '200':
          description: SKU registrado exitosamente en la base de datos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkuRegistrationResponse'
              example:
                status: "success"
                message: "SKU 'LT240815' registrado exitosamente"
                sku_id: 12345
                item_gtin_id: 11535
                gtin_code: "7750304964586"
                lot_number: "LT240815"
                registered_at: "2024-01-15T10:30:00Z"
        '400':
          description: Datos de entrada inválidos o SKU ya existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Medication Registration
      summary: Registrar medicamento enriquecido en base de datos GTIN
      description: |
        ## 📝 Registro de Medicamento Enriquecido con IA
        
        Este endpoint registra directamente un medicamento enriquecido en la base de datos GTIN, 
        preparando automáticamente los datos y marcándolo como generado por IA.
        
        ### 🔍 **Flujo Completo:**
        1. **Recibe datos**: `MedicationData` (del endpoint `/extract`) + metadatos de enriquecimiento
        2. **Validación automática**: Verifica GTIN único, campos obligatorios y aprobación del usuario
        3. **Preparación inteligente**: Determina tipo GTIN automáticamente y mapea campos
        4. **Registro en BD**: Inserta con flag `IsAiGenerated = true` para auditoría
        5. **Vectorización automática**: Actualiza Qdrant para mejorar futuras búsquedas semánticas
        
        ### 📊 **Validaciones y Procesamiento Automático:**
        - ✅ Determina tipo de GTIN por longitud del código (GTIN_8/12/13/14)
        - ✅ Verifica que el GTIN no exista previamente en la base de datos
        - ✅ Valida campos obligatorios: `medication_name`, `common_denomination`, `gtin_code`
        - ✅ Requiere aprobación explícita del usuario (`user_approved: true`)
        - ✅ Marca automáticamente como generado por IA para auditoría
        
        ### 🎯 **Campos Automáticos/Opcionales:**
        - **Automáticos**: `gtin_code_type`, `IsAiGenerated = true`
        - **Con defaults**: `pharmacy_type = "M"`, `state = "ACTIVO"`, `fractions = "1"`
        - **Opcionales**: `code_rs_list`, campos vacíos se almacenan como cadena vacía
        
      operationId: registerEnrichedMedication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicationRegistrationRequest'
            examples:
              semantic_search_example:
                summary: Medicamento enriquecido por búsqueda semántica
                description: Ejemplo de medicamento enriquecido con alta confianza usando búsqueda semántica
                value:
                  medication_data:
                    medication_name: "Bronpax"
                    common_denomination: "Ambroxol"
                    concentration: "7.5 mg/mL"
                    form: "Solución oral"
                    form_simple: "Gotas"
                    brand_name: "FARMINDUSTRIA"
                    country: "PERÚ"
                    presentation: "20mL"
                    product_type: "PRODUCTO FARMACEUTICO"
                    fractions: "1"
                    gtin_code: null
                  gtin_code: "7750304964586"
                  enrichment_source: "semantic_search"
                  enrichment_confidence: 0.87
                  user_approved: true
                  
              ocr_extraction_example:
                summary: Medicamento con datos mínimos del OCR
                description: Ejemplo de medicamento con datos básicos extraídos por OCR
                value:
                  medication_data:
                    medication_name: "Paracetamol 500mg"
                    common_denomination: "Paracetamol"
                    concentration: "500 mg"
                    form_simple: "Tabletas"
                  gtin_code: "1234567890123"
                  enrichment_source: "ocr_extraction"
                  enrichment_confidence: 0.65
                  user_approved: true
                  
              database_gtin_example:
                summary: Medicamento enriquecido desde BD GTIN
                description: Ejemplo de medicamento enriquecido usando datos existentes en la BD GTIN
                value:
                  medication_data:
                    medication_name: "Ibuprofeno"
                    common_denomination: "Ibuprofeno"
                    concentration: "400 mg"
                    form: "Tableta recubierta"
                    form_simple: "Tabletas"
                    brand_name: "LABORATORIO XYZ"
                    country: "COLOMBIA"
                    presentation: "10 tabletas"
                    product_type: "PRODUCTO FARMACEUTICO"
                    fractions: "1"
                  gtin_code: "9876543210987"
                  enrichment_source: "database_gtin"
                  enrichment_confidence: 0.95
                  user_approved: true
                  
      responses:
        '200':
          description: Medicamento registrado exitosamente en la base de datos GTIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicationRegistrationResponse'
              examples:
                success_response:
                  summary: Registro exitoso con vectorización
                  value:
                    status: "success"
                    message: "Medicamento 'Bronpax' registrado exitosamente como generado por IA"
                    medication_id: 12345
                    gtin_code: "7750304964586"
                    registered_at: "2024-01-15T10:30:00Z"
                    is_ai_generated: true
                    enrichment_metadata:
                      enrichment_source: "semantic_search"
                      enrichment_confidence: 0.87
                      user_approved: true
                      auto_vectorized: true
                      pharmacy_type: "M"
                      gtin_code_type: "GTIN_13"
                      
        '400':
          description: Datos de entrada inválidos o medicamento ya existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                user_not_approved:
                  summary: Usuario no aprobó los datos
                  value:
                    detail: "No se puede registrar medicamento sin aprobación del usuario"
                    
                gtin_already_exists:
                  summary: GTIN ya existe en la base de datos
                  value:
                    detail: "El medicamento con GTIN 7750304964586 ya existe en la base de datos"
                    
                missing_required_field:
                  summary: Campo requerido faltante
                  value:
                    detail: "medication_name es obligatorio"
                    
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                database_error:
                  summary: Error de base de datos
                  value:
                    detail: "Error interno al registrar medicamento: Database connection failed"
                    
                vectorization_error:
                  summary: Error de vectorización (medicamento registrado)
                  value:
                    detail: "Medicamento registrado pero falló la vectorización automática"

components:
  schemas:
    MedicationData:
      type: object
      description: Datos extraídos y/o enriquecidos del medicamento
      properties:
        medication_name:
          type: string
          nullable: true
          description: Nombre comercial del medicamento
          example: "Bronpax"
          
        common_denomination:
          type: string
          nullable: true
          description: Denominación común o principio activo
          example: "Ambroxol"
          
        concentration:
          type: string
          nullable: true
          description: Concentración del medicamento
          example: "7.5 mg/mL"
          
        form:
          type: string
          nullable: true
          description: Forma farmacéutica completa
          example: "Solución oral"
          
        form_simple:
          type: string
          nullable: true
          description: Forma farmacéutica simplificada
          example: "Gotas"
          
        brand_name:
          type: string
          nullable: true
          description: Marca o laboratorio
          example: "FARMINDUSTRIA"
          
        country:
          type: string
          nullable: true
          description: País de origen
          example: "PERÚ"
          
        presentation:
          type: string
          nullable: true
          description: Presentación del producto
          example: "20mL"
          
        product_type:
          type: string
          nullable: true
          description: Tipo de producto
          example: "PRODUCTO FARMACEUTICO"
          
        fractions:
          type: string
          nullable: true
          description: Número de fracciones
          example: "1"
          
        gtin_code:
          type: string
          nullable: true
          description: Código GTIN si se encuentra en los datos originales
          example: null
          
        lot_number:
          type: string
          nullable: true
          description: Número de lote del medicamento
          example: "LT240815"
          
        expiration_date:
          type: string
          nullable: true
          description: Fecha de vencimiento del medicamento en formato yyyy-MM-dd
          format: date
          example: "2025-12-01"
          
        database_id:
          type: integer
          nullable: true
          description: ID del medicamento en la base de datos GTIN (si se encontró)
          example: 11535
          
    MedicationRegistrationRequest:
      type: object
      required:
        - medication_data
        - gtin_code
        - enrichment_source
        - enrichment_confidence
        - user_approved
      properties:
        medication_data:
          $ref: '#/components/schemas/MedicationData'
          description: Datos del medicamento extraído y enriquecido
          
        gtin_code:
          type: string
          description: Código GTIN del medicamento
          pattern: '^[0-9]{8,14}$'
          example: "7750304964586"
          
        enrichment_source:
          type: string
          description: Fuente del enriquecimiento
          enum: 
            - "semantic_search"
            - "ocr_extraction"
            - "database_gtin"
            - "manual_input"
          example: "semantic_search"
          
        enrichment_confidence:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          description: Confianza del enriquecimiento (0.0 - 1.0)
          example: 0.87
          
        user_approved:
          type: boolean
          description: Si fue aprobado por el usuario
          example: true
          
        gtin_code_type:
          type: string
          nullable: true
          description: Tipo de código GTIN (se determina automáticamente si no se proporciona)
          enum:
            - "GTIN_8"
            - "GTIN_12"
            - "GTIN_13"
            - "GTIN_14"
          example: "GTIN_13"
          
        pharmacy_type:
          type: string
          nullable: true
          description: Tipo de farmacia
          default: "M"
          example: "M"
          
        code_rs_list:
          type: string
          nullable: true
          description: Código RS
          example: "EN04755"
          
        state:
          type: string
          nullable: true
          description: Estado del medicamento
          default: "ACTIVO"
          enum:
            - "ACTIVO"
            - "INACTIVO"
            - "PENDIENTE"
          example: "ACTIVO"
          
    SkuRegistrationRequest:
      type: object
      required:
        - item_gtin_id
        - gtin_code
        - lot_number
        - expiration_date
        - quantity
        - pharmacy_id
        - uploader_id
      properties:
        item_gtin_id:
          type: integer
          description: ID del medicamento en ItemsGtin
          example: 11535
        gtin_code:
          type: string
          description: Código GTIN del medicamento
          example: "7750304964586"
        lot_number:
          type: string
          description: Número de lote del medicamento
          example: "LT240815"
        expiration_date:
          type: string
          format: date
          description: Fecha de expiración en formato yyyy-MM-dd
          example: "2025-12-01"
        quantity:
          type: integer
          description: Cantidad disponible
          example: 100
        price:
          type: number
          format: float
          default: 0.0
          description: Precio unitario
          example: 15.50
        pharmacy_id:
          type: integer
          description: ID de la farmacia
          example: 1
        uploader_id:
          type: integer
          description: ID del usuario que sube el SKU
          example: 1
        received_date:
          type: string
          format: date
          nullable: true
          description: Fecha de recepción en formato yyyy-MM-dd
          example: "2024-01-15"
        code:
          type: string
          nullable: true
          description: Código interno del SKU
          example: "SKU001"
        description:
          type: string
          nullable: true
          description: Descripción adicional
          example: "Lote de prueba"
        is_active:
          type: boolean
          default: true
          description: Si el SKU está activo
          example: true

    SkuRegistrationResponse:
      type: object
      required:
        - status
        - message
        - item_gtin_id
        - gtin_code
        - lot_number
        - registered_at
      properties:
        status:
          type: string
          description: Estado de la operación
          example: "success"
        message:
          type: string
          description: Mensaje descriptivo
          example: "SKU 'LT240815' registrado exitosamente"
        sku_id:
          type: integer
          nullable: true
          description: ID del SKU en la base de datos
          example: 12345
        item_gtin_id:
          type: integer
          description: ID del medicamento en ItemsGtin
          example: 11535
        gtin_code:
          type: string
          description: Código GTIN
          example: "7750304964586"
        lot_number:
          type: string
          description: Número de lote
          example: "LT240815"
        registered_at:
          type: string
          format: date-time
          description: Timestamp del registro
          example: "2024-01-15T10:30:00Z"

    MedicationRegistrationResponse:
      type: object
      required:
        - status
        - message
        - gtin_code
        - registered_at
        - is_ai_generated
      properties:
        status:
          type: string
          description: Estado de la operación
          enum: ["success", "error"]
          example: "success"
          
        message:
          type: string
          description: Mensaje descriptivo
          example: "Medicamento 'Bronpax' registrado exitosamente como generado por IA"
          
        medication_id:
          type: integer
          nullable: true
          description: ID del medicamento en la base de datos
          example: 12345
          
        gtin_code:
          type: string
          description: Código GTIN registrado
          example: "7750304964586"
          
        registered_at:
          type: string
          format: date-time
          description: Timestamp del registro en formato ISO 8601
          example: "2024-01-15T10:30:00Z"
          
        is_ai_generated:
          type: boolean
          description: Indica si fue generado por IA
          example: true
          
        enrichment_metadata:
          type: object
          nullable: true
          description: Metadatos del proceso de enriquecimiento
          properties:
            enrichment_source:
              type: string
              example: "semantic_search"
            enrichment_confidence:
              type: number
              format: float
              example: 0.87
            user_approved:
              type: boolean
              example: true
            auto_vectorized:
              type: boolean
              description: Si se vectorizó automáticamente en Qdrant
              example: true
            pharmacy_type:
              type: string
              example: "M"
            gtin_code_type:
              type: string
              example: "GTIN_13"
              
    ErrorResponse:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
          description: Descripción del error
          example: "Error processing medication: Invalid input data"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token para autenticación (si aplica en el futuro)

security:
  - {} # Sin autenticación por ahora

tags:
  - name: Medication Registration
    description: |
      ## 💊 Registro de Medicamentos Enriquecidos
      
      Endpoints para registrar medicamentos que han sido procesados y enriquecidos por algoritmos de IA.
      
      ### 🎯 **Características:**
      - Validación automática de datos
      - Marcado con flag de IA
      - Vectorización automática
      - Trazabilidad completa 